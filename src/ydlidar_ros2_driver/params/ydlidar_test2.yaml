ydlidar_ros2_driver_node_2:
  ros__parameters:
    port: /dev/ttyUSB2
    frame_id: laser_frame_2
    ignore_array: ""
    baudrate: 230400
    lidar_type: 1
    device_type: 0
    isSingleChannel: false
    intensity: true
    intensity_bit: 0
    sample_rate: 9
    abnormal_check_count: 4
    # true면 FixedSize(≈930)로 자르는데 실제 점이 931~933이라 경고/손실 발생
    fixed_resolution: false
    reversion: false
    inverted: false
    auto_reconnect: true
    support_motor_dtr: false
    angle_max: 180.0
    angle_min: -180.0
    range_max: 64.0
    range_min: 0.01
    frequency: 10.0
    invalid_range_is_inf: false
    debug: false
